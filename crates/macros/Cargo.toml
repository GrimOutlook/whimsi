[package]
name = "whimsi-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
darling = "0.21.3"
debug_print = "1.0.0"
fancy-regex = "0.16.2"
itertools = "0.14.0"
msi = { path = "../../../rust-msi/" }
proc-macro2 = "1.0"
quote = "1.0"
strum = { version = "0.27.2", features = ["derive"] }
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
ambassador = "0.5.0"
pretty_assertions = "1.4.1"
